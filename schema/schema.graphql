schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Item {
  id: ID!
  kind: String!
  title: String!
  notes: String
  tags: [String!]!
  assigneeId: String
  visibility: String!
  severity: String
  recurrence: AWSJSON
  dueAt: Float
  warnWindow: Float
  lastDoneAt: Float
  lastDoneBy: String
  snoozedUntil: Float
  archived: Boolean!
  createdBy: String!
  createdAt: Float!
  updatedAt: Float!
  version: Int!
}

input ItemInput {
  id: ID!
  kind: String!
  title: String!
  notes: String
  tags: [String!]!
  assigneeId: String
  visibility: String!
  severity: String
  recurrence: AWSJSON
  dueAt: Float
  warnWindow: Float
  snoozedUntil: Float
  archived: Boolean!
}

type Completion {
  itemId: ID!
  at: Float!
  by: String!
  note: String
}

type Tag {
  id: ID!
  name: String!
  group: String!
  color: String
  order: Int
  deleted: Boolean
  updatedAt: Float!
}

input TagInput {
  id: ID!
  name: String!
  group: String!
  color: String
  order: Int
}

type Profile {
  userId: ID!
  username: String!
  displayName: String
  color: String
  theme: String
  density: String
  defaultView: AWSJSON
  savedViews: AWSJSON
  alertPrefs: AWSJSON
  "When the Member last opened Activity (ms). Only moves forward; capped at the server's now."
  activitySeenAt: Float
  setupComplete: Boolean!
  updatedAt: Float!
}

input ProfileInput {
  displayName: String
  color: String
  theme: String
  density: String
  defaultView: AWSJSON
  savedViews: AWSJSON
  alertPrefs: AWSJSON
  "When the Member last opened Activity (ms). Only moves forward; capped at the server's now."
  activitySeenAt: Float
  setupComplete: Boolean
}

type FeedEvent {
  id: ID!
  at: Float!
  by: String!
  type: String!
  itemId: String
  title: String
  detail: String
}

type Snapshot {
  items: [Item!]!
  tags: [Tag!]!
  profiles: [Profile!]!
  feed: [FeedEvent!]!
  "The Fridge: unexpired Notes, pinned first, then newest first."
  notes: [Note!]!
  serverTime: Float!
}

"Item mutations fan out to subscribers through this envelope."
type ItemChange {
  item: Item!
  visibility: String!
  "Members who could see the item before this change and can't now. They drop it from their store."
  removedFor: [String!]
  "True when item is a placeholder (only id, version and visibility are real). Receivers not in removedFor refresh."
  redacted: Boolean
}

"One device's Web Push state for the caller. The endpoint and keys are write-only."
type PushDevice {
  deviceId: ID!
  enabled: Boolean!
}

"A short note on one Item (M2). Append-only. Seen only where both its Item's current Visibility and the Item's Visibility when it was written allow."
type Comment {
  id: ID!
  itemId: ID!
  at: Float!
  by: String!
  text: String!
}

"addComment fans out to subscribers through this envelope. visibility is the Item's when written (a replay: the narrower of that and the Item's now)."
type CommentChange {
  comment: Comment!
  visibility: String!
}

# ---- Fridge Notes (m2/02) ----

"One Note on the Fridge. Append-only: after postNote only pinned and expiresAt change."
type Note {
  id: ID!
  text: String!
  by: String!
  at: Float!
  pinned: Boolean!
  "Epoch ms; hidden from then on. Null = never expires."
  expiresAt: Float
  "Always shared; carried so the subscription filter matches Items'."
  visibility: String!
  updatedAt: Float!
  "The Task this Note was turned into (m2/03). Null = not turned into a Task."
  taskId: ID
}

type Query {
  me: Profile!
  snapshot: Snapshot!
  completions(itemId: ID!, limit: Int): [Completion!]!
  "The Item's Comments, oldest first. NotFound if the caller can't see the Item."
  comments(itemId: ID!): [Comment!]!
}

type Mutation {
  "Create or update. expectedVersion guards concurrent edits; omit to force (last-write-wins)."
  putItem(input: ItemInput!, expectedVersion: Int): ItemChange!
  completeItem(itemId: ID!, at: Float, note: String): ItemChange!
  undoCompletion(itemId: ID!, at: Float!): ItemChange!
  putTag(input: TagInput!): Tag!
  deleteTag(id: ID!): Tag!
  putProfile(input: ProfileInput!): Profile!
  "Save this device's Web Push subscription. Same deviceId again replaces it."
  putPushSubscription(deviceId: ID!, endpoint: String!, p256dh: String!, auth: String!): PushDevice!
  "Turn notifications off on this device."
  deletePushSubscription(deviceId: ID!): PushDevice!
  "Add a Comment. The client picks id, so a retry with the same id writes nothing twice."
  addComment(itemId: ID!, id: ID!, text: String!): CommentChange!
  "Post a Note on the Fridge. The id comes from the client, so a replay returns the stored Note."
  postNote(id: ID!, text: String!, pinned: Boolean, expiresAt: Float): Note!
  pinNote(id: ID!, pinned: Boolean!): Note!
  "Set the Note's expiry, or clear it with null."
  setNoteExpiry(id: ID!, expiresAt: Float): Note!
  "Mark the Note as turned into this Task (m2/03). The first Task wins; later calls return the Note as is."
  markNoteTasked(id: ID!, taskId: ID!): Note!
}

type Subscription {
  onItemChange: ItemChange @aws_subscribe(mutations: ["putItem", "completeItem", "undoCompletion"])
  onTagChange: Tag @aws_subscribe(mutations: ["putTag", "deleteTag"])
  onProfileChange: Profile @aws_subscribe(mutations: ["putProfile"])
  onCommentChange: CommentChange @aws_subscribe(mutations: ["addComment"])
  onNoteChange: Note @aws_subscribe(mutations: ["postNote", "pinNote", "setNoteExpiry", "markNoteTasked"])
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <clipPath id="body"><ellipse cx="256" cy="296" rx="128" ry="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- honeycomb hint -->
  <g fill="none" stroke="#f4b73b" stroke-width="10" opacity=".55">
    <path d="M64 92l34-20 34 20v40l-34 20-34-20z"/>
    <path d="M380 412l34-20 34 20v40l-34 20-34-20z"/>
    <path d="M414 72l26-15 26 15v30l-26 15-26-15z"/>
  </g>
  <!-- wings -->
  <g fill="#e6f6ff" stroke="#3a2a12" stroke-width="12">
    <ellipse cx="190" cy="168" rx="62" ry="78" transform="rotate(-24 190 168)"/>
    <ellipse cx="322" cy="168" rx="62" ry="78" transform="rotate(24 322 168)"/>
  </g>
  <!-- antennae -->
  <g stroke="#3a2a12" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M228 196 C 214 150, 196 132, 176 124"/>
    <path d="M284 196 C 298 150, 316 132, 336 124"/>
  </g>
  <circle cx="174" cy="122" r="14" fill="#3a2a12"/>
  <circle cx="338" cy="122" r="14" fill="#3a2a12"/>
  <!-- stinger -->
  <path d="M372 318 l46 -6 -40 30z" fill="#3a2a12"/>
  <!-- body + stripes -->
  <ellipse cx="256" cy="296" rx="128" ry="112" fill="#ffc22e"/>
  <g clip-path="url(#body)" fill="#3a2a12">
    <rect x="276" y="170" width="34" height="260"/>
    <rect x="340" y="170" width="34" height="260"/>
  </g>
  <ellipse cx="256" cy="296" rx="128" ry="112" fill="none" stroke="#3a2a12" stroke-width="12"/>
  <!-- face -->
  <circle cx="190" cy="282" r="15" fill="#3a2a12"/>
  <circle cx="242" cy="282" r="15" fill="#3a2a12"/>
  <circle cx="195" cy="276" r="5" fill="#fff"/>
  <circle cx="247" cy="276" r="5" fill="#fff"/>
  <ellipse cx="170" cy="318" rx="17" ry="11" fill="#ff8fa3" opacity=".8"/>
  <ellipse cx="262" cy="318" rx="17" ry="11" fill="#ff8fa3" opacity=".8"/>
  <path d="M196 322 q20 22 40 0" fill="none" stroke="#3a2a12" stroke-width="10" stroke-linecap="round"/>
</svg>

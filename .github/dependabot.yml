version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # One PR for every @aws-sdk/* bump, so the clients stay on the same version.
      aws-sdk:
        patterns: ["@aws-sdk/*"]
    ignore:
      # TypeScript 7 (native compiler) drops moduleResolution node10, which infra uses. Upgrade by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
